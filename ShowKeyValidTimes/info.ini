name = ShowKeyValidTimes
displayName = 显示物品可用次数
description = 显示钥匙剩余可用次数/总可用次数！（尤其方便看钥匙包里面钥匙的状态）此外还会显示装备可用耐久，药品等可用的治疗量等。装备的显示格式为88/100(90)表示当前耐久88，新装备上限100，可维修上限90，可以快速判断武器耐久是否大于50%，这里耐久为88%（低于50%耐久武器散布会增大很多） | Displays key uses: X/Y! . Also shows gear durability and consumable healing values. Gear Durability format: 88/100(90) indicates: Current 88, New item max 100, Repairable max 90; Quickly verify weapons durability >50% threshold - weapons below 50% suffer severe accuracy penalties.

